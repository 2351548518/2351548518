<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ZeeoRe — Somewhere between logic and love.</title>
  <desc id="desc">A cyan mathematical orbit meets a rose-colored constellation on a midnight-blue canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#111D2C"/><stop offset="1" stop-color="#151723"/></linearGradient>
    <linearGradient id="line" x1="620" y1="80" x2="940" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#79DFD3"/><stop offset="1" stop-color="#ECA9C5"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#79DFD3" stop-opacity=".09"/><stop offset="1" stop-color="#79DFD3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" stroke="#B4D5E5" stroke-opacity=".045"/></pattern>
  </defs>
  <rect x=".5" y=".5" width="999" height="359" rx="18" fill="url(#bg)" stroke="#2A3544"/>
  <rect x="1" y="1" width="998" height="358" rx="18" fill="url(#grid)"/>
  <circle cx="778" cy="173" r="180" fill="url(#glow)"/>
  <path d="M44 38H68M44 38V62M956 298V322H932" stroke="#6B7B8E" stroke-opacity=".6"/>
  <g font-family="'Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="2">
    <circle cx="62" cy="72" r="3" fill="#79DFD3"/>
    <text x="76" y="76" fill="#A8B9C9">2351548518 / PERSONAL SPACE</text>
    <text x="56" y="316" fill="#7D91A5">LOGIC × LOVE</text>
    <text x="797" y="316" fill="#7D91A5">HELLO, WORLD_</text>
  </g>
  <text x="53" y="168" fill="#F1F5F9" font-family="'Segoe UI',Arial,sans-serif" font-size="76" font-weight="650" letter-spacing="-4">ZeeoRe<tspan fill="#79DFD3">.</tspan></text>
  <text x="57" y="209" fill="#B7C5D5" font-family="'Segoe UI',Arial,sans-serif" font-size="20" letter-spacing=".3">Somewhere between logic and love.</text>
  <text x="57" y="245" fill="#8096AB" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" letter-spacing="3">数学的尽头，是与你相连的世界。</text>
  <g stroke="url(#line)">
