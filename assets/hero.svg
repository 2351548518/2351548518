    <ellipse cx="776" cy="170" rx="59" ry="123" stroke-opacity=".35"/>
    <path d="M605 170H939M776 42V292" stroke-opacity=".16" stroke-dasharray="3 6"/>
    <path d="M610 171C638 171 640 111 668 111S698 231 727 231S756 111 785 111S814 231 843 231S872 171 900 171" stroke-width="2"/>
